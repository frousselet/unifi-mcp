[project]
name = "unifi-mcp"
version = "0.1.0"
description = "MCP server for the UniFi Site Manager API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.0.0",
    "webauthn>=2.0.0",
]

[project.scripts]
unifi-mcp = "unifi_mcp.server:main"
unifi-mcp-web = "unifi_mcp.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_mcp"]
